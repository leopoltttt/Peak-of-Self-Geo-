<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Peak of Self</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Noto+Serif+Georgian:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b132b; --bg2:#1c2541; --bg3:#3a506b;
  --accent:#5bc0be; --glow:#6fffe9; --orange:#ff8a3d; --gold:#e3b95f;
  --text:#e8eefc; --muted:#9fb0d0; --panel:rgba(12,20,46,.9);
  --sans:"Noto Sans Georgian",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Noto Serif Georgian",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.screen{position:fixed;inset:0}
.hidden{display:none!important}

/* ---------- INTRO ---------- */
#intro{display:flex;align-items:center;justify-content:center;overflow:auto;
  background:radial-gradient(1100px 700px at 50% 15%,#1c2541 0%,#0b132b 62%,#070c1d 100%);transition:opacity .7s ease}
#intro.fade-out{opacity:0;pointer-events:none}
#introFx{position:absolute;inset:0;width:100%;height:100%}
.intro-wrap{position:relative;z-index:2;text-align:center;padding:24px;width:100%;max-width:560px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;opacity:.9}
.title{font-size:clamp(38px,10vw,78px);font-weight:700;letter-spacing:.2em;margin-right:-.2em;line-height:1.05;color:#fff}
.title span{font-weight:200;color:var(--accent);font-size:.62em;vertical-align:.12em;margin:0 .1em}
.subtitle{margin-top:16px;font-size:clamp(12px,2.8vw,16px);letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;color:var(--muted)}
.modal-card{margin:38px auto 0;text-align:left;background:rgba(28,37,65,.72);border:1px solid rgba(111,255,233,.16);border-radius:22px;padding:26px 24px 22px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);animation:fadeUp .9s .15s both}
.modal-card label{display:block;font-size:13px;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.modal-card input{width:100%;font-size:18px;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(11,19,43,.7);color:var(--text);outline:none;transition:border-color .2s, box-shadow .2s}
.modal-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,192,190,.25)}
.modal-card input.shake{animation:shake .4s}
.fine{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.04em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:700;letter-spacing:.06em;font-size:15px;transition:transform .15s, box-shadow .25s, filter .2s}
.btn.primary{background:linear-gradient(135deg,#ff8a3d,#ffb65e);color:#1a1020;box-shadow:0 8px 26px rgba(255,138,61,.32)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(255,138,61,.45)}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.big{width:100%;margin-top:18px;padding:16px 24px;font-size:16px;letter-spacing:.2em}
.btn:focus-visible,.card:focus-visible,#soundBtn:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

/* ---------- GAME ---------- */
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,rgba(5,9,24,.75),rgba(5,9,24,0));pointer-events:none}
#hud>*{pointer-events:auto}
.hud-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand{font-size:11px;letter-spacing:.3em;color:var(--accent);font-weight:700}
#hudName{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.hud-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#pips{display:flex;gap:5px}
#pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);transition:all .4s}
#pips i.done{background:var(--orange);border-color:var(--orange);box-shadow:0 0 8px rgba(255,138,61,.7)}
#pips i.cur{background:var(--glow);border-color:var(--glow);box-shadow:0 0 10px rgba(111,255,233,.8);transform:scale(1.25)}
.hud-stat{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.hud-stat b{color:var(--text);font-weight:600}
#soundBtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(12,20,46,.7);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s}
#soundBtn:hover{background:rgba(28,37,65,.9)}
#soundBtn svg{width:20px;height:20px}
@media (max-width:520px){.brand{display:none}.hud-stat .alt{display:none}}

.panel{position:absolute;z-index:5;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(111,255,233,.16);
  border-radius:20px;padding:20px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);overflow:auto;
  transition:opacity .4s ease,translate .4s ease,background .6s}
.panel.out{opacity:0;pointer-events:none;translate:0 14px}
.panel.in{animation:fadeUp .5s both}
body.layout-bottom .panel{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;max-height:56vh;max-height:56dvh}
body.layout-side .panel{right:24px;top:50%;transform:translateY(-50%);width:min(440px,36vw);max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px)}
.panel.narrating{background:rgba(3,6,16,.94);border-color:rgba(255,255,255,.08)}
.tag{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;font-weight:600}
.prompt{font-size:clamp(16px,1.2vw + 12px,21px);line-height:1.45;font-weight:500;color:#f2f6ff;margin-bottom:14px}
textarea{width:100%;min-height:92px;resize:vertical;font:16px/1.5 var(--sans);color:var(--text);padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,192,190,.22)}
textarea.shake{animation:shake .4s;border-color:#ff6b6b}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4;flex:1;min-width:140px}
.hint.warn{color:#ffb4a2}
.hint.ok{color:#8ff0c2}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;min-height:128px;padding:18px 16px;text-align:left;border-radius:16px;
  border:1px solid rgba(255,255,255,.16);background:linear-gradient(160deg,rgba(58,80,107,.5),rgba(28,37,65,.7));transition:transform .2s,border-color .25s,box-shadow .25s,background .3s}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px rgba(91,192,190,.22)}
.card .big{font-size:clamp(20px,2.4vw + 10px,26px);font-weight:700;letter-spacing:.04em;color:#fff}
.card .desc{font-size:13px;line-height:1.4;color:var(--muted)}
.card.wrong{animation:shake .45s;border-color:#ff6b6b;background:linear-gradient(160deg,rgba(120,30,40,.55),rgba(40,15,25,.8))}
.card.right{border-color:#8ff0c2;box-shadow:0 0 28px rgba(143,240,194,.35)}

.lock{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.lock-icon{width:46px;height:46px;color:var(--gold);transition:color .4s,filter .4s}
.lock-icon svg{width:100%;height:100%;overflow:visible}
.lock-icon .shackle{transition:transform .5s;transform-origin:17px 11px}
.lock-icon.open{color:#8ff0c2;filter:drop-shadow(0 0 10px rgba(143,240,194,.7))}
.lock-icon.open .shackle{transform:translateY(-3px) rotate(-22deg)}
.equation{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-size:clamp(20px,3vw + 10px,30px);font-weight:600;font-variant-numeric:tabular-nums;margin:4px 0}
.equation .br{color:var(--accent);font-weight:300;font-size:1.3em}
.equation input{width:104px;text-align:center;font:inherit;color:#fff;padding:6px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);outline:none}
.equation input:focus{border-color:var(--glow);box-shadow:0 0 0 3px rgba(111,255,233,.2)}
.equation input.shake{animation:shake .4s;border-color:#ff6b6b}
.equation input.good{border-color:#8ff0c2;color:#8ff0c2}

.quote{font-family:var(--serif);font-style:italic;font-size:clamp(18px,1.6vw + 12px,23px);line-height:1.6;color:#dfe6ff;margin:4px 0 14px;animation:fadeUp 1.2s both}
.voice{display:flex;align-items:center;gap:12px}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:18px}
.bars i{width:3px;height:100%;background:var(--accent);border-radius:2px;transform-origin:bottom;animation:bars 1.1s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}
.bars.off i{animation:none;transform:scaleY(.2);opacity:.4}

.toast{position:fixed;z-index:30;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(12,20,46,.95);border:1px solid rgba(111,255,233,.3);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .35s}
.toast.show{opacity:1;transform:translate(-50%,0)}
#reopen{position:absolute;z-index:6;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%)}

/* ---------- PASSPORT ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(3,6,16,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .6s}
.overlay.show{opacity:1}
.passport{position:relative;width:min(580px,100%);max-height:94vh;max-height:94dvh;overflow:auto;border-radius:20px;padding:28px 24px 24px;color:var(--text);
  background:linear-gradient(160deg,#16224a 0%,#0b132b 55%,#080e22 100%);border:2px solid #c9a24a;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 60px rgba(201,162,74,.12);animation:fadeUp .8s .1s both}
.passport::before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,162,74,.38);border-radius:14px;pointer-events:none}
.pp-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.emblem{width:54px;height:54px;flex:none}
.pp-eyebrow{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.passport h2{font-size:clamp(17px,3.6vw,22px);letter-spacing:.16em;color:var(--gold);line-height:1.25;margin-top:4px}
.pp-id{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;padding:14px 0;border-top:1px solid rgba(201,162,74,.3);border-bottom:1px solid rgba(201,162,74,.3);margin-bottom:18px}
.pp-id span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.pp-id b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.stamp{position:absolute;right:2px;top:50%;translate:0 -50%;rotate:-9deg;border:2px dashed rgba(255,138,61,.75);color:rgba(255,138,61,.85);border-radius:10px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.18em;text-align:center;line-height:1.3}
.pp-block{margin-bottom:18px}
.pp-block h3{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.pp-style{font-size:clamp(24px,5vw,31px);font-weight:700;color:#fff;line-height:1.2;margin-bottom:6px}
.pp-block p{font-size:14.5px;line-height:1.6;color:#cdd8f0}
.pp-sub{margin-top:6px;font-size:12.5px;color:var(--muted)}
.power{padding:16px;border-radius:14px;background:linear-gradient(135deg,rgba(255,138,61,.16),rgba(111,255,233,.08));border:1px solid rgba(255,138,61,.4);box-shadow:0 0 30px rgba(255,138,61,.1)}
.pp-power{font-size:clamp(20px,4.4vw,26px)!important;font-weight:800;color:var(--orange)!important;letter-spacing:.02em;margin-bottom:6px}
.power .own{font-family:var(--serif);font-style:italic;color:#e9eefc}
.insights{list-style:none;counter-reset:ins;display:grid;gap:10px}
.insights li{counter-increment:ins;position:relative;padding:12px 14px 12px 48px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.insights li::before{content:counter(ins);position:absolute;left:12px;top:12px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent);color:#08121f}
.insights b{display:block;font-size:14px;color:#fff;margin-bottom:4px}
.insights p{font-size:13.5px}
.msg blockquote{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.6;color:#e9eefc;padding-left:14px;border-left:3px solid var(--gold)}
.pp-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.pp-actions .btn{flex:1 1 150px;padding:12px 14px;font-size:13.5px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bars{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- mobile keyboard handling (driven by visualViewport vars) ---------- */
#game{bottom:auto;height:var(--app-h,100%)}
#intro{bottom:auto;top:var(--vvt,0px);height:var(--vvh,100%);overscroll-behavior:contain}
body.layout-bottom .panel{bottom:calc(12px + var(--kb,0px) + env(safe-area-inset-bottom,0px));max-height:min(56vh,56dvh,calc(var(--vvh,100dvh) - 76px));scroll-padding-block:12px;overscroll-behavior:contain}
body.layout-side .panel{top:calc(50% - var(--kb,0px) / 2);max-height:calc(var(--vvh,100dvh) - 80px)}
textarea,input{scroll-margin-block:16px}

/* ---------- language switch + Georgian typography ---------- */
.lang{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(28,37,65,.72);border:1px solid rgba(111,255,233,.16);margin-bottom:22px}
.lang button{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s}
.lang button:hover{color:var(--text)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#08121f}
.lang button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
html[lang="ka"] :is(.eyebrow,.subtitle,.tag,.pp-eyebrow,.pp-block h3,.hud-stat,.pp-id span,.stamp,.btn,.card .big){text-transform:none;letter-spacing:.03em}
html[lang="ka"] :is(.quote,.msg blockquote,.power .own){font-style:normal}
html[lang="ka"] .prompt{line-height:1.55}
html[lang="ka"] .passport h2{letter-spacing:.04em}
</style>


<!-- INTRO (no mountains here by design) -->
<section id="intro" class="screen">
  <canvas id="introFx"></canvas>
  <div class="intro-wrap">
    <div class="lang" role="group" aria-label="Language / ენა"><button type="button" data-lang="ka" aria-pressed="true">ქართული</button><button type="button" data-lang="en" aria-pressed="false">English</button></div>
    <p class="eyebrow" data-i18n="eyebrow">An interactive reflection quest</p>
    <h1 class="title">PEAK<span>OF</span>SELF</h1>
    <p class="subtitle" data-i18n="subtitle">A Journey to Inner Resilience</p>
    <form id="nameModal" class="modal-card" autocomplete="off">
      <label for="nameInput" data-i18n="nameLabel">Who is making the climb?</label>
      <input id="nameInput" type="text" maxlength="24" placeholder="Enter your name" data-i18n-ph="namePh" autocomplete="off" enterkeyhint="go">
      <button type="submit" id="startBtn" class="btn primary big" data-i18n="start">START ASCENT</button>
      <p class="fine" data-i18n="fine">Headphones recommended · sound on for the full experience</p>
    </form>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen hidden">
  <canvas id="scene"></canvas>
  <header id="hud">
    <div class="hud-left"><span class="brand">PEAK OF SELF</span><span id="hudName"></span></div>
    <div class="hud-mid"><div id="pips"></div><div class="hud-stat"><b id="hudLevel">Level 1 / 10</b><span class="alt"> · <span id="hudAlt">0 m</span></span></div></div>
    <button id="soundBtn" type="button" aria-label="Mute or unmute sound" aria-pressed="false"></button>
  </header>
  <aside id="panel" class="panel out" aria-live="polite"></aside>
  <button id="reopen" class="btn primary hidden" type="button" data-i18n="reopen">Open Passport</button>
</section>

<div id="passport" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ppTitle"></div>
<div id="toast" class="toast" role="status"></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">Peak of Self needs JavaScript to run.</p></noscript>

} catch (e) {}
const grp = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const T = {

/* ---------- frame ---------- */
let lastT = 0, running = false;

  if (!running) return;

  if (climber.moving) climber.phase += dt * .012;
  view.reserve += (view.reserveT - view.reserve) * (1 - Math.exp(-dt / 110));
  draw(now, dt);
}

  c.restore();

const CHORDS = [[45,52,55,59,60,64],[41,48,52,57,60,64],[36,48,55,59,62,64],[43,50,55,57,62,69]];
function makeIR(ctx_, dur = 5, decay = 2.6){
  const rate = ctx_.sampleRate, len = Math.floor(rate * dur), buf = ctx_.createBuffer(2, len, rate);
  for (let c = 0; c < 2; c++){ const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return buf;
}
const audio = {
  ctx:null, master:null, duckG:null, bus:null, timer:null, next:0, idx:0,
  init(){
    if (this.ctx){ this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = 0; this.master.connect(c.destination);
      this.duckG = c.createGain(); this.duckG.connect(this.master);
      const music = c.createGain(); music.gain.value = .9; music.connect(this.duckG);
      const comp = c.createDynamicsCompressor(); comp.connect(music);
      this.bus = c.createGain(); this.bus.gain.value = 1;
      const dry = c.createGain(); dry.gain.value = .5; this.bus.connect(dry); dry.connect(comp);
      const conv = c.createConvolver(); conv.buffer = makeIR(c); const wet = c.createGain(); wet.gain.value = .95; this.bus.connect(conv); conv.connect(wet); wet.connect(comp);
      const dl = c.createDelay(2); dl.delayTime.value = .62; const fb = c.createGain(); fb.gain.value = .38;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
      this.bus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl);
      const dw = c.createGain(); dw.gain.value = .32; lp.connect(dw); dw.connect(comp);
      this.next = c.currentTime + .2;
      this.timer = setInterval(() => this.schedule(), 700); this.schedule();
      this.master.gain.setTargetAtTime(state.sound ? .55 : 0, c.currentTime, 1.6);
    } catch (e) { this.ctx = null; }
  },
  resume(){ if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setOn(on){ if (this.ctx) this.master.gain.setTargetAtTime(on ? .55 : 0, this.ctx.currentTime, .25); },
  duck(on){ if (this.ctx) this.duckG.gain.setTargetAtTime(on ? .28 : 1, this.ctx.currentTime, .6); },
  schedule(){
    const c = this.ctx; if (!c) return;
    if (this.next < c.currentTime) this.next = c.currentTime + .1;
    while (this.next < c.currentTime + 4){ this.chord(CHORDS[this.idx % CHORDS.length], this.next); this.bells(this.next); this.next += 12; this.idx++; }
  },
  chord(notes, t){
    const c = this.ctx, dur = 12.5, atk = 4.5, rel = 6.5;
    const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = .6; filt.connect(this.bus);
    filt.frequency.setValueAtTime(480, t); filt.frequency.linearRampToValueAtTime(1100, t + dur * .5); filt.frequency.linearRampToValueAtTime(520, t + dur + rel);
    notes.forEach((n, i) => {
      const peak = i === 0 ? .07 : .032, g = c.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + atk); g.gain.setValueAtTime(peak, t + dur); g.gain.linearRampToValueAtTime(0, t + dur + rel); g.connect(filt);
      [['sawtooth', -7, .45], ['triangle', 6, 1]].forEach(([type, det, lv]) => {
        const o = c.createOscillator(), og = c.createGain(); o.type = type; o.frequency.value = mtof(n); o.detune.value = det + (Math.random() - .5) * 4; og.gain.value = lv;
        o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + rel + .2);
      });
    });
  },
  bells(t){
    const c = this.ctx, sc = [69, 72, 74, 76, 79, 81], n = 2 + ((Math.random() * 2) | 0);
    for (let i = 0; i < n; i++){
      const w = t + 2 + Math.random() * 9, o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = mtof(sc[(Math.random() * sc.length) | 0]);
      g.gain.setValueAtTime(0, w); g.gain.linearRampToValueAtTime(.05, w + .02); g.gain.exponentialRampToValueAtTime(.0008, w + 5);
      o.connect(g); g.connect(this.bus); o.start(w); o.stop(w + 5.2);
    }
  },
  tone(freq, when, dur, vol, type = 'sine'){
    const c = this.ctx; if (!c || !state.sound) return;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = freq;
    const t = c.currentTime + when; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  chime(){ this.tone(mtof(79), 0, 1.2, .08); this.tone(mtof(86), .09, 1.6, .06); },
  fanfare(){ [69, 72, 76, 81, 84].forEach((n, i) => this.tone(mtof(n), i * .16, 2.4, .07)); },
  thud(){
    const c = this.ctx; if (!c || !state.sound) return;
    const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; const t = c.currentTime;
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(38, t + .35);
    g.gain.setValueAtTime(.22, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + .45);

/* ---------- narrator (speech synthesis) ---------- */
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
function pickVoice(){
  if (!synth) return null;
  const vs = synth.getVoices() || [];
  if (LANG === 'ka') return vs.find(v => /^ka\b/i.test(v.lang) || /georgian|ქართ/i.test(v.name)) || null;
  const en = vs.filter(v => /^en/i.test(v.lang));
  const prefs = ['Google UK English Male', 'Daniel', 'Microsoft George', 'Microsoft David', 'Microsoft Mark', 'Arthur', 'Alex', 'Fred', 'Oliver', 'Aaron', 'Rishi', 'Male'];
  for (const p of prefs){ const v = en.find(x => x.name.indexOf(p) !== -1); if (v) return v; }
  return en[0] || null;
}
if (synth && synth.addEventListener) synth.addEventListener('voiceschanged', () => {});
function unlockSpeech(){ try { if (!synth) return; const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch (e) {} }
function narrate(text){
  return new Promise(res => {
    if (!synth || !state.sound){ res(false); return; }
    let done = false, started = false;
    const fin = v => { if (!done){ done = true; res(v); } };
    try {
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text), v = pickVoice();
      if (LANG === 'ka' && !v){ fin(false); return; }
      u.pitch = .55; u.rate = .8; u.volume = 1; u.lang = LANG === 'ka' ? 'ka-GE' : 'en-GB';
      if (v){ u.voice = v; u.lang = v.lang; }
      u.onstart = () => { started = true; };
      u.onend = () => fin(true); u.onerror = () => fin(false);
      synth.speak(u);
      setTimeout(() => { if (!started) fin(false); }, 2800);
      setTimeout(() => fin(started), 4000 + text.length * 130);
    } catch (e) { fin(false); }
  });
}

const PRIORITY = ['resilience','growth','compassion','courage','wisdom','discipline','connection'];
const count = (t, re) => (t.match(re) || []).length;
const cnt = (t, k) => count(t, LEX[k]) + count(t, LEXKA[k]);
const oneLine = (t, max = 110) => {
  t = String(t || '').replace(/\s+/g, ' ').trim();
  const s = ((t.match(/[^.!?]+[.!?]?/) || [t])[0] || '').trim();
  return s.length > max ? s.slice(0, max - 1).trim() + '…' : s;
};
function hashHex(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).toUpperCase().padStart(8, '0'); }

function buildPassport(){
  const A = state.answers, keys = [0, 2, 4, 6, 8, 9], wt = {0:1, 2:1, 4:1.2, 6:1, 8:1.8, 9:1.6};
  const cats = ['resilience','courage','growth','compassion','wisdom','connection','discipline'], sc = {};
  cats.forEach(c => sc[c] = 0);
  let doubt = 0, pos = 0, neg = 0;
  keys.forEach(k => {
    const t = A[k] || '';
    cats.forEach(c => sc[c] += cnt(t, c) * wt[k]);
    doubt += cnt(t, 'doubt'); pos += cnt(t, 'positive'); neg += cnt(t, 'negative');
  });
  const ranked = PRIORITY.slice().sort((a, b) => sc[b] - sc[a] || PRIORITY.indexOf(a) - PRIORITY.indexOf(b));
  const AR = k => (LANG === 'ka' ? ARCH_KA : ARCH)[k];
  let arch, second = null;
  if (sc[ranked[0]] > 0){ arch = AR(ranked[0]); if (sc[ranked[1]] > 0) second = AR(ranked[1]).tag; }
  else if (doubt + neg > pos) arch = tt('honest');
  else arch = AR('resilience');
  const mood = pos + sc.resilience * .5 + sc.compassion * .5 - (neg + doubt * .6);
  const weather = mood > 2 ? tt('wHope') : mood < -1 ? tt('wHeavy') : tt('wBal');

  const a3 = A[2] || '', a5 = A[4] || '', a7 = A[6] || '';
  const notForgiven = /\b(not|never|haven'?t|hadn'?t|couldn'?t|can'?t|cannot|didn'?t|did not|still)\b[^.!?]{0,30}forgiv|hard to forgive|unforgiv|still (blame|blaming|hate|angry at) myself/i.test(a5) || KA_NOT_FORGIVEN.test(a5);
  const forgave = !notForgiven && (/\b(forgave|forgiven|forgive myself|i forgive|learned to forgive|let (it|that) go|moved on)\b/i.test(a5) || KA_FORGAVE.test(a5));
  const defensive = /defensive|hurt|upset|angry|sensitive|personal|offend|sting|shut down|ignore/i.test(a3) || KA_DEFENSIVE.test(a3);
  const open = /listen|learn|consider|constructive|improve|reflect|open to|feedback is/i.test(a3) || KA_OPEN.test(a3);
  const compares = /compar|jealous|envy|envious|behind|slower|everyone else|others are|not as good/i.test(a7) || KA_COMPARES.test(a7);
  const ins = [];
  ins.push({title: tt('i1t'), text: notForgiven ? tt('i1a') : forgave ? tt('i1b') : tt('i1c')});
  ins.push({title: tt('i2t'), text: defensive ? tt('i2a') : open ? tt('i2b') : tt('i2c')});
  const resp = oneLine(A[8], 90);
  ins.push({title: tt('i3t'), text: (compares ? tt('i3a') : tt('i3b')) + (resp ? tt('i3r', resp) : '')});

  const message = (A[9] || '').replace(/\s+/g, ' ').trim();
  return {
    name: state.name, date: fmtDate(new Date()),
    serial: 'PIR-' + hashHex(JSON.stringify(A)), altitude: fmtAlt(4800), stumbles: state.wrong,
    style: arch.style, second, power: arch.power, blurb: arch.blurb + ' ' + weather,
    ownWords: oneLine(A[8] || A[9] || '', 120), insights: ins, message
  };
}

/* ---------- PNG export ---------- */
function wrapText(g, text, x, y, maxW, lh, draw){
  const words = String(text).split(/\s+/); let line = '';
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line){ if (draw) g.fillText(line, x, y); y += lh; line = w; } else line = t;
  }
  if (line){ if (draw) g.fillText(line, x, y); y += lh; }
  return y;
}
function paintPassport(g, P, W, H, draw){
  const pad = 80, maxW = W - pad * 2;
  if (draw){
    const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#16224a'); bg.addColorStop(.6, '#0b132b'); bg.addColorStop(1, '#080e22');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#c9a24a'; g.lineWidth = 6; rr(g, 18, 18, W - 36, H - 36, 34); g.stroke();
    g.strokeStyle = 'rgba(201,162,74,.4)'; g.lineWidth = 2; rr(g, 34, 34, W - 68, H - 68, 26); g.stroke();
  }
  let y = pad + 40;
  const set = (font, color, align = 'left') => { g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic'; };
  const para = (str, font, color, lh) => { set(font, color); y = wrapText(g, str, pad, y, maxW, lh, draw); };
  const label = str => { y += 18; set(`700 22px ${FONT}`, '#5bc0be'); if ('letterSpacing' in g) g.letterSpacing = '5px'; if (draw) g.fillText(U(str), pad, y); if ('letterSpacing' in g) g.letterSpacing = '0px'; y += 40; };
  set(`600 22px ${FONT}`, '#5bc0be', 'center'); if ('letterSpacing' in g) g.letterSpacing = '6px'; if (draw) g.fillText(U(tt('ppEyebrow')), W / 2, y); y += 56;
  set(`700 44px ${FONT}`, '#e3b95f', 'center'); if (draw) g.fillText(tt('headA'), W / 2, y); y += 54; if (draw) g.fillText(tt('headB'), W / 2, y);
  if ('letterSpacing' in g) g.letterSpacing = '0px'; y += 50;
  if (draw){ g.strokeStyle = 'rgba(201,162,74,.4)'; g.lineWidth = 2; g.beginPath(); g.moveTo(pad, y); g.lineTo(W - pad, y); g.stroke(); } y += 46;
  para(tt('cHolder', P.name), `700 32px ${FONT}`, '#ffffff', 42);
  para(tt('cMeta', P.date, P.altitude, P.stumbles), `400 24px ${FONT}`, '#9fb0d0', 36);
  para(tt('cNo', P.serial), `400 22px ${FONT}`, '#9fb0d0', 34);
  label(tt('hStyle'));
  para(P.style, `800 54px ${FONT}`, '#ffffff', 64); y += 4;
  para(P.blurb, `400 28px ${FONT}`, '#cdd8f0', 42);
  label(tt('hPower'));
  para(P.power, `800 46px ${FONT}`, '#ff8a3d', 58);
  if (P.ownWords) para(quo(P.ownWords), `${ital()}28px ${SERIF}`, '#e9eefc', 42);
  label(tt('hInsights'));
  P.insights.forEach((i, n) => { para(`${n + 1}. ${i.title}`, `700 30px ${FONT}`, '#ffffff', 42); para(i.text, `400 25px ${FONT}`, '#cdd8f0', 37); y += 14; });
  if (P.message){ label(tt('cMsg')); para(quo(P.message), `${ital()}28px ${SERIF}`, '#e9eefc', 42); }
  y += 30; set(`400 20px ${FONT}`, '#6f82a8', 'center'); if (draw) g.fillText(tt('cFoot'), W / 2, y);
  return y + pad;
}
function passportCanvas(P){
  const W = 1080, probe = document.createElement('canvas').getContext('2d');
  const H = Math.ceil(paintPassport(probe, P, W, 0, false));
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  paintPassport(cv.getContext('2d'), P, W, H, true); return cv;
}

function downloadPassport(){
  try {
    const url = passportCanvas(PP).toDataURL('image/png');
    const ov = document.createElement('div'); ov.className = 'overlay show'; ov.style.zIndex = 40;
    ov.innerHTML = `<div class="passport" style="text-align:center"><p class="pp-eyebrow" style="margin-bottom:12px">${esc(tt('holdSave'))}</p><img alt="${esc(tt('ppTitleCase'))}" style="max-width:100%;border-radius:10px"><div class="pp-actions"><button class="btn primary" type="button">${esc(tt('close'))}</button></div></div>`;

async function sharePassport(){
  const text = shareText(PP);
  try {
    if (navigator.share){
      const data = {title:tt('ppTitleCase'), text};
      try {
        const blob = await new Promise(r => passportCanvas(PP).toBlob(r, 'image/png'));
        const file = blob && new File([blob], 'passport-of-inner-resilience.png', {type:'image/png'});
        if (file && navigator.canShare && navigator.canShare({files:[file]})) data.files = [file];
      } catch (e) {}
      await navigator.share(data); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast(tt('copied')); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(tt('copied')); } catch (e2) { toast(tt('shareNa')); }
    ta.remove();
  }
}

function resetGameState(){
  state.level = 0; state.answers = {}; state.wrong = 0; state.correct = {}; state.finished = false; state.busy = false; state.started = true;
}
async function restart(){
  if (state.busy) return; state.busy = true;
  closePassport(); $('#reopen').classList.add('hidden'); hidePanel();
  if (synth) synth.cancel();
  tween(climber, 'cheer', 0, 500); tween(flag, 't', 0, 900); tween(view, 'glow', 0, 1200);
  await tween(climber, 'd', wpD[0], 2200, easeIO);
  resetGameState(); state.busy = false; showLevel(0);
}
function startGame(){
  state.started = true; resetGameState();
  climber.d = wpD[0]; climber.tilt = 0; climber.dy = 0; climber.cheer = 0; flag.t = 0; view.dark = 0; view.glow = 0;
  $('#hudName').textContent = state.name; updateSoundIcon();
  resize(); updateHud(false);
  running = true; lastT = 0; requestAnimationFrame(frame);
  showLevel(0);
}

/* ---------- intro particles ---------- */
let introActive = true;
(function introFx(){
  const cv = $('#introFx'), g = cv.getContext('2d'); let w = 0, h = 0, dp = 1, ps = [];
  function rs(){
    dp = Math.min(window.devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; cv.width = w * dp; cv.height = h * dp;
    ps = Array.from({length:Math.round(w * h / 16000)}, () => ({x:Math.random() * w, y:Math.random() * h, r:Math.random() * 1.6 + .4, v:Math.random() * .16 + .03, a:Math.random() * .5 + .1, p:Math.random() * 6.28}));
  }
  rs(); addEventListener('resize', rs);
  (function f(t){
    if (!introActive) return;
    g.setTransform(dp, 0, 0, dp, 0, 0); g.clearRect(0, 0, w, h);
    for (const p of ps){
      p.y -= p.v; if (p.y < -4){ p.y = h + 4; p.x = Math.random() * w; }
      g.fillStyle = `rgba(160,200,255,${p.a * (.6 + .4 * Math.sin(t * .001 + p.p))})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
    }
    requestAnimationFrame(f);
  })(0);
})();

/* ---------- wiring ---------- */
$('#nameModal').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#nameInput').value.trim();
  state.name = v || tt('defaultName');
  audio.init(); unlockSpeech();
  if (!cache) cache = buildCache();
  const intro = $('#intro'); intro.classList.add('fade-out');
  $('#game').classList.remove('hidden');
  setTimeout(() => { intro.classList.add('hidden'); introActive = false; }, 750);
  startGame();
});
$('#soundBtn').addEventListener('click', () => {
  state.sound = !state.sound; audio.setOn(state.sound); if (state.sound) audio.resume();
  if (!state.sound && synth) synth.cancel();
  updateSoundIcon();
});
$('#reopen').addEventListener('click', () => { $('#reopen').classList.add('hidden'); showPassport(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#passport').classList.contains('hidden')){ closePassport(); $('#reopen').classList.remove('hidden'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) audio.resume(); });
/* ---------- virtual keyboard: keep the scene still, lift the panel, scroll the field into view ---------- */
(function keyboardFix(){
  const root = document.documentElement, vv = window.visualViewport;
  const isField = el => !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
  let baseW = innerWidth, baseH = innerHeight, raf = 0;
  function apply(){
    raf = 0;
    const editing = isField(document.activeElement);
    const h = vv ? vv.height : innerHeight, top = vv ? vv.offsetTop : 0;
    const kb = Math.max(0, Math.round(baseH - h - top));
    const open = editing && kb > 80;
    if (open){
      root.style.setProperty('--kb', kb + 'px'); root.style.setProperty('--vvh', Math.round(h) + 'px');
      root.style.setProperty('--vvt', Math.round(top) + 'px'); root.style.setProperty('--app-h', baseH + 'px');
    } else ['--kb', '--vvh', '--vvt', '--app-h'].forEach(p => root.style.removeProperty(p));
    if (open !== kbOpen){ kbOpen = open; if (!open && running) resize(); }
  }
  const schedule = () => { if (!raf) raf = requestAnimationFrame(apply); };
  function pageToTop(){ if (window.scrollY || window.scrollX) window.scrollTo(0, 0); const s = document.scrollingElement; if (s && s.scrollTop) s.scrollTop = 0; }
  if (vv){ vv.addEventListener('resize', schedule); vv.addEventListener('scroll', schedule); }
  addEventListener('scroll', pageToTop, {passive:true});
  addEventListener('resize', () => {
    // while the keyboard is up the window shrinks: ignore it, so the canvas and layout are not rebuilt
    if (isField(document.activeElement) && innerWidth === baseW && innerHeight < baseH){ schedule(); return; }
    baseW = innerWidth; baseH = innerHeight; schedule(); if (running) resize();
  });
  addEventListener('orientationchange', () => setTimeout(() => { baseW = innerWidth; baseH = innerHeight; schedule(); if (running) resize(); }, 300));
  function reveal(el){
    if (document.activeElement !== el) return;
    try { el.scrollIntoView({block:'center', inline:'nearest', behavior:'smooth'}); } catch (e) { try { el.scrollIntoView(); } catch (e2) {} }
    pageToTop();
  }
  document.addEventListener('focusin', e => {
    const el = e.target; if (!isField(el)) return;
    schedule();
    // the keyboard animates in: scroll again once it has settled
    setTimeout(() => { schedule(); reveal(el); }, 150);
    setTimeout(() => { schedule(); reveal(el); }, 450);
  });
  document.addEventListener('focusout', () => setTimeout(() => { schedule(); pageToTop(); }, 120));
  schedule();
})();
function applyLang(l){
  LANG = l === 'en' ? 'en' : 'ka';
  try { localStorage.setItem('peakLang', LANG); } catch (e) {}
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tt(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = tt(el.dataset.i18nPh); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  updateSoundIcon();
  if (LANG === 'ka' && document.fonts && document.fonts.load){ try { document.fonts.load('700 20px "Noto Sans Georgian"', 'აბგ'); document.fonts.load('400 20px "Noto Serif Georgian"', 'აბგ'); } catch (e) {} }
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));
applyLang(LANG);
// build the heavy static scene once, right after first paint
setTimeout(() => { if (!cache) cache = buildCache(); }, 60);
setTimeout(() => { const n = $('#nameInput'); if (n && window.matchMedia && matchMedia('(pointer:fine)').matches) n.focus({preventScroll:true}); }, 400);
})();
